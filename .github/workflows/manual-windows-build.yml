name: Manual Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 executable and shim
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build executable and shim
        shell: pwsh
        run: .\scripts\build-dev-portable.ps1 -ActionsBuild

      - name: Upload executable and shim
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AIMToolkit-exe-and-shim-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/aim-ramdisk-manager.exe
            target/x86_64-pc-windows-msvc/release/build/**/aimapi-adapter-shim.dll
          if-no-files-found: error
          retention-days: 14

      - name: Upload available executable and shim if build fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: AIMToolkit-exe-and-shim-diagnostics
          path: |
            target/x86_64-pc-windows-msvc/release/aim-ramdisk-manager.exe
            target/x86_64-pc-windows-msvc/release/build/**/aimapi-adapter-shim.dll
          if-no-files-found: warn
          retention-days: 14
